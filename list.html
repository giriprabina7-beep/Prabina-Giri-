<html>

<head>
    <title>List item example</title>
</head>

<body>
    <h1>List item example</h1>
    <p>This is example of creating ordered list and unordered item</p>
    <h2>fruits</h2>
    <ol>
        <li>apple</li>
        <li>banana</li>
        <li>grapes</li>
        <li>orange</li>
    </ol>
    <h2>Vegetable</h2>
    <ul>
        <li>potato</li>
        <li>tomato</li>
        <li>onion</li>
    </ul>
</body>

</html>
